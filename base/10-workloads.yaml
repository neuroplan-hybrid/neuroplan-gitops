apiVersion: v1
kind: ConfigMap
metadata:
  name: neuroplan-backend-config
  labels:
    app.kubernetes.io/part-of: neuroplan-login-mvp
data:
  # 현재 격리된 Data Network의 MaxScale 4006 리스너는 TLS 미구성입니다.
  DB_URL: jdbc:mariadb://192.168.44.21:4006/infraready?sslMode=disable
  JWT_ISSUER: neuroplan-auth
  JWT_ACCESS_TTL: 15m
  JWT_REFRESH_TTL: 7d
  JWT_REAUTH_TTL: 5m
  AUTH_COOKIE_SECURE: "true"
  # MVP 관리자 계정. 운영 전 팀 승인 이메일로 교체합니다(여러 개는 쉼표로 구분).
  ADMIN_EMAILS: admin@nplan.local
  LLM_ENABLED: "true"
  # Gemini API만 사용합니다. API 키는 neuroplan-gemini-secrets에서 주입합니다.
  LLM_PROVIDER: GEMINI
  GEMINI_BASE_URL: https://generativelanguage.googleapis.com/v1beta
  GEMINI_MODEL: gemini-3.5-flash-lite
  LLM_PROMPT_VERSION: neuroplan-0.8.0-gemini-v2
  LLM_MAX_COMPLETION_TOKENS: "1200"
  LLM_QUIZ_MAX_COMPLETION_TOKENS: "1600"
  LLM_DAILY_TOKEN_LIMIT: "30000"
  GEMINI_CONNECT_TIMEOUT_SECONDS: "5"
  GEMINI_READ_TIMEOUT_SECONDS: "60"
  DEMO_READINESS_FAIL: "false"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neuroplan-frontend
  labels:
    app.kubernetes.io/name: neuroplan-frontend
    app.kubernetes.io/part-of: neuroplan-login-mvp
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: neuroplan-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: neuroplan-frontend
        app.kubernetes.io/part-of: neuroplan-login-mvp
    spec:
      imagePullSecrets:
        - name: harbor-pull-secret
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: harbor.nplan.local:80/neuroplan/frontend
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: neuroplan-frontend
  labels:
    app.kubernetes.io/name: neuroplan-frontend
    app.kubernetes.io/part-of: neuroplan-login-mvp
spec:
  selector:
    app.kubernetes.io/name: neuroplan-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neuroplan-backend
  labels:
    app.kubernetes.io/name: neuroplan-backend
    app.kubernetes.io/part-of: neuroplan-login-mvp
spec:
  # 세션 상태를 MariaDB jwt_sessions에 저장하므로 복제본 간 로그인이 유지됩니다.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # 신규 Pod가 Ready가 되기 전까지 기존 정상 Pod를 유지합니다.
      maxUnavailable: 0
      # 장애 시연 시 신규 버전 Pod는 한 개만 추가 기동합니다.
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: neuroplan-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: neuroplan-backend
        app.kubernetes.io/part-of: neuroplan-login-mvp
    spec:
      imagePullSecrets:
        - name: harbor-pull-secret
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: harbor.nplan.local:80/neuroplan/backend
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: neuroplan-backend-config
            - secretRef:
                name: neuroplan-auth-secrets
            - secretRef:
                name: neuroplan-gemini-secrets
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: neuroplan-backend
  labels:
    app.kubernetes.io/name: neuroplan-backend
    app.kubernetes.io/part-of: neuroplan-login-mvp
spec:
  selector:
    app.kubernetes.io/name: neuroplan-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: neuroplan-frontend
  labels:
    app.kubernetes.io/part-of: neuroplan-login-mvp
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: neuroplan-frontend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: neuroplan-backend
  labels:
    app.kubernetes.io/part-of: neuroplan-login-mvp
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: neuroplan-backend
