apiVersion: v1
kind: Service
metadata:
  name: neuroplan-backend-health
  labels:
    app.kubernetes.io/name: neuroplan-backend
    app.kubernetes.io/part-of: neuroplan-login-mvp
    neuroplan.io/purpose: route53-health
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: neuroplan-backend
  publishNotReadyAddresses: true
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
