# T6 abort-before-promotion only: preserve DB_URL and disable fence.
# Preconditions: RDS Writer and ir_app validated, RDS direct replication to
# both on-prem DB replicas healthy, and DB owner GO for ROSA-only write resume.
# On-Prem Backend stays fenced. Route 53 cutover requires separate GO.
# MariaDB Connector/J 3.5.7: verify-full validates both the CA chain and
# the RDS endpoint hostname. The public RDS CA bundle must be mounted from
# neuroplan-rds-ca ConfigMap BEFORE this PR is merged (see RDS-TLS-PREFLIGHT.md).
# A failed CA mount or failed TLS validation must block rollout, not fall
# back to an unverified connection.
apiVersion: v1
kind: ConfigMap
metadata:
  name: neuroplan-backend-config
data:
  DB_URL: "jdbc:mariadb://neuroplan-rds-operation.cp0uso08u0oq.ap-northeast-2.rds.amazonaws.com:3306/infraready?sslMode=verify-full&serverSslCert=/etc/neuroplan/rds-ca/ca-bundle.pem"
  # Later Kustomize patch overrides 30; false is required in BOTH patches for abort.
  DEMO_WRITE_FENCE: "false"
