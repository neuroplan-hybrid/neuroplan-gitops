apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: neuroplan

resources:
  - ../../base
  - 15-health-service.yaml
  - 20-routes.yaml
  - 25-route-tls-rbac.yaml
  - 40-backend-servicemonitor.yaml

patches:
  - path: 30-backend-config-patch.yaml
  # #93: Fence ConfigMap 변경과 동시에 Backend PodTemplate을 바꿔 롤아웃을 유도한다.
  - path: 31-cutover-write-fence-rollout.yaml

  # ROSA는 AWS ECR credential provider + Worker IAM Role로 이미지를 Pull합니다.
  # base의 imagePullSecret은 ROSA에서 제거합니다.
  - target:
      kind: Deployment
      name: neuroplan-frontend
    patch: |-
      - op: remove
        path: /spec/template/spec/imagePullSecrets

  - target:
      kind: Deployment
      name: neuroplan-backend
    patch: |-
      - op: remove
        path: /spec/template/spec/imagePullSecrets

  # #93: Writer 전환용 RDS DB_URL 및 Backend 롤아웃. 적용은 별도 Cutover 승인 후.
  - path: 32-backend-rds-url-patch.yaml
  - path: 33-backend-rds-rollout.yaml

# #93 RDS TLS preflight — CA bundle only. No DB_URL, Secret, or Deployment changes.
# Keep name fixed: PR #14 mounts ConfigMap "neuroplan-rds-ca" literally.
configMapGenerator:
  - name: neuroplan-rds-ca
    files:
      - ca-bundle.pem=certs/ap-northeast-2-bundle.pem
    options:
      disableNameSuffixHash: true

images:
  - name: 707191185613.dkr.ecr.ap-northeast-2.amazonaws.com/neuroplan-frontend
    newName: 707191185613.dkr.ecr.ap-northeast-2.amazonaws.com/neuroplan-frontend
    newTag: "d67b2bd"

  - name: 707191185613.dkr.ecr.ap-northeast-2.amazonaws.com/neuroplan-backend
    newName: 707191185613.dkr.ecr.ap-northeast-2.amazonaws.com/neuroplan-backend
    newTag: "ca91bb8"
