apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: neuroplan-tls-secret-reader
  namespace: neuroplan
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - neuroplan-cloud-rosa-tls
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: neuroplan-tls-secret-reader
  namespace: neuroplan
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: neuroplan-tls-secret-reader
subjects:
  - kind: ServiceAccount
    name: router
    namespace: openshift-ingress
