# MERGE GATE: RDS is the sole Writer, GTID/data checks pass, On-Prem is fenced.
# Keep later patch 32 aligned so Kustomize does not restore Fence=true.
apiVersion: v1
kind: ConfigMap
metadata:
  name: neuroplan-backend-config
data:
  DEPLOYMENT_SITE: rosa
  DEMO_WRITE_FENCE: "false"
