# neuroplan.cloud 도메인 확정 기준 ROSA 애플리케이션 Route입니다.
# OpenShift 4.20.40 Route externalCertificate 방식으로
# neuroplan-cloud-rosa-tls Secret을 참조합니다.
# 인증서/개인 키 자체는 Git에 저장하지 않습니다.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: neuroplan-api
  labels:
    app.kubernetes.io/part-of: neuroplan-login-mvp
spec:
  host: app.neuroplan.cloud
  path: /api
  to:
    kind: Service
    name: neuroplan-backend
  port:
    targetPort: http
  tls:
    termination: edge
    externalCertificate:
      name: neuroplan-cloud-rosa-tls
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: neuroplan-frontend
  labels:
    app.kubernetes.io/part-of: neuroplan-login-mvp
spec:
  host: app.neuroplan.cloud
  path: /
  to:
    kind: Service
    name: neuroplan-frontend
  port:
    targetPort: http
  tls:
    termination: edge
    externalCertificate:
      name: neuroplan-cloud-rosa-tls
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: neuroplan-primary-health
  labels:
    app.kubernetes.io/part-of: neuroplan-login-mvp
    neuroplan.io/purpose: route53-health
spec:
  host: primary-health.neuroplan.cloud
  path: /actuator/health/routing
  to:
    kind: Service
    name: neuroplan-backend-health
  port:
    targetPort: http
  tls:
    termination: edge
    externalCertificate:
      name: neuroplan-cloud-rosa-tls
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
