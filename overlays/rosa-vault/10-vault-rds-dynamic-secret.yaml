apiVersion: v1
kind: ServiceAccount
metadata:
  name: neuroplan-vault-auth
  namespace: neuroplan
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: neuroplan-vault
  namespace: neuroplan
spec:
  # Vault는 ROSA 내부에서만 접근합니다. TLS 적용 시 https + CA Secret으로 전환합니다.
  address: http://vault.vault.svc.cluster.local:8200
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: neuroplan-vault-auth
  namespace: neuroplan
spec:
  vaultConnectionRef: neuroplan-vault
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: neuroplan-backend
    serviceAccount: neuroplan-vault-auth
    audiences:
      - vault
    tokenExpirationSeconds: 600
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultDynamicSecret
metadata:
  name: neuroplan-rds-credentials
  namespace: neuroplan
spec:
  vaultAuthRef: neuroplan-vault-auth
  mount: database
  path: creds/neuroplan-backend-rds
  revoke: true
  destination:
    create: true
    name: neuroplan-rds-dynamic
    transformation:
      excludes:
        - ".*"
      templates:
        DB_USERNAME:
          text: '{{ get .Secrets "username" }}'
        DB_PASSWORD:
          text: '{{ get .Secrets "password" }}'
  # Spring Boot는 환경변수를 런타임에 다시 읽지 않으므로 계정 교체 시 Backend를 재기동합니다.
  rolloutRestartTargets:
    - kind: Deployment
      name: neuroplan-backend
