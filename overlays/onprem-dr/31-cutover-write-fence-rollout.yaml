# T8 On-Prem DR write stop: roll out Backend Pods to apply Fence=true.
# Merge only after DB owner approves the write-stop window; ROSA stays fenced.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neuroplan-backend
spec:
  template:
    metadata:
      annotations:
        neuroplan.io/write-fence-rollout: "t8-onprem-write-stop-20261016"
