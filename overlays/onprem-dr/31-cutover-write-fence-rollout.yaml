# On-Prem-only operation: roll out Backend Pods to load Fence=false.
# Apply this change only while db-primary is the sole database Writer.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neuroplan-backend
spec:
  template:
    metadata:
      annotations:
        neuroplan.io/write-fence-rollout: "onprem-fence-off-20261022"
