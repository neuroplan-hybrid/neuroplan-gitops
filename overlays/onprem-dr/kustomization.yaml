apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: application

resources:
  - ../../base
  - 20-httproute.yaml

patches:
  - path: 30-backend-config-patch.yaml

  - target:
      kind: Deployment
      name: neuroplan-frontend
    patch: |-
      - op: replace
        path: /spec/template/spec/imagePullSecrets/0/name
        value: ecr-pull-secret
      # 커밋 SHA 고정 태그 → 캐시 재사용, 만료 토큰으로 인한 불필요한 재Pull 방지 (#33 A+B)
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent

  - target:
      kind: Deployment
      name: neuroplan-backend
    patch: |-
      - op: replace
        path: /spec/template/spec/imagePullSecrets/0/name
        value: ecr-pull-secret
      # 커밋 SHA 고정 태그 → 캐시 재사용, 만료 토큰으로 인한 불필요한 재Pull 방지 (#33 A+B)
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent

images:
  - name: harbor.nplan.local:80/neuroplan/frontend
    newName: 707191185613.dkr.ecr.ap-northeast-2.amazonaws.com/neuroplan-frontend
    newTag: "bcc6857"

  - name: harbor.nplan.local:80/neuroplan/backend
    newName: 707191185613.dkr.ecr.ap-northeast-2.amazonaws.com/neuroplan-backend
    newTag: "a4d120f"
