apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-thanos-reader
  namespace: neuroplan
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: grafana-thanos-reader
  namespace: openshift-monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-monitoring-view
subjects:
  - kind: ServiceAccount
    name: grafana-thanos-reader
    namespace: neuroplan
