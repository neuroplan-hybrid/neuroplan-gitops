apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: neuroplan-vault
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://helm.releases.hashicorp.com
    chart: vault
    targetRevision: 0.34.1
    helm:
      releaseName: vault
      values: |
        global:
          openshift: true
        injector:
          enabled: false
        server:
          ha:
            enabled: true
            replicas: 3
            raft:
              enabled: true
              setNodeId: true
          dataStorage:
            enabled: true
            size: 10Gi
        ui:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
